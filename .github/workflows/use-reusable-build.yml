name: Use Reusable Build

on:
  workflow_dispatch:

jobs:
  build:
    uses: JKalinaPEPE/lab-github-actions-t03/.github/workflows/reusable-build.yml@main
    with:
      image-name: mi-aplicacion
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}